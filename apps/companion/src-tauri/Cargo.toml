[package]
name = "chittie-companion-app"
version = "0.1.1"
description = "Chittie Companion — the print bridge + diagnostics/studio for any web POS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chittie_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The embeddable print core + HTTP server (one core, three shells).
chittie_agent = { package = "print-agent", path = "../../../tools/print-agent" }
