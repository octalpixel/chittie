[package]
name = "chittie-companion-app"
version = "0.1.0"
description = "Chittie Companion — the print bridge + diagnostics/studio for any web POS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chittie_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
# The embeddable print core + HTTP server (one core, three shells).
chittie_agent = { path = "../../../tools/print-agent" }
