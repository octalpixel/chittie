name: print-agent release

# Tag a release to build + publish binaries, e.g.:
#   git tag print-agent-v0.1.0 && git push origin print-agent-v0.1.0
on:
  push:
    tags:
      - 'print-agent-v*'
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/print-agent

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/print-agent

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          bin="chittie-print-agent${{ matrix.ext }}"
          out="chittie-print-agent-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/$bin" "$out"
          shasum -a 256 "$out" > "$out.sha256" || sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: chittie-print-agent-${{ matrix.target }}
          path: |
            tools/print-agent/chittie-print-agent-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/chittie-print-agent-*
          generate_release_notes: true
