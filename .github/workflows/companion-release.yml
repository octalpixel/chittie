name: companion-release

# Build the Chittie Companion (apps/companion) as native installers for macOS,
# Windows, and Linux via tauri-action — mirrors ordereka's proven Windows build.
# Trigger: push a tag like `companion-v0.1.0`, or run manually.
# Prerequisite: apps/companion/src-tauri/icons/* must be committed (`tauri icon`).

on:
  push:
    tags:
      - 'companion-v*'
  workflow_dispatch:

permissions:
  contents: write # tauri-action creates the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (webkit2gtk for Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/companion/src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/companion
          tagName: ${{ github.ref_name }}
          releaseName: 'Chittie Companion ${{ github.ref_name }}'
          releaseBody: 'Print bridge + diagnostics. Installers for macOS / Windows / Linux below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
