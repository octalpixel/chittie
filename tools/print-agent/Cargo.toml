[package]
name = "print-agent"
version = "0.1.0"
edition = "2024"
description = "Chittie print agent — localhost raw ESC/POS bridge for thermal printers"

# Embeddable core (lift into a Tauri command / CLI), shared by the bin below.
[lib]
name = "chittie_agent"
path = "src/lib.rs"

[[bin]]
name = "chittie-print-agent"
path = "src/main.rs"

[dependencies]
font8x8 = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nusb = "0.2.4"
printers = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"

# Small, self-contained binary for customer terminals.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
